[project]
name = "liftosaur-sync"
version = "1.1.1"
description = "Sync Liftosaur workout history to supported targets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tabulate>=0.9.0",
]

[project.scripts]
liftosaur-sync = "liftosaur_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
